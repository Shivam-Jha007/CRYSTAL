<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crystal - Build bit by bit</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="signup.js"></script>
</head>
<body>
  <div class="wrapper">
    <div class="form-card">
      <h2>Create Account</h2>
      <p class="form-subtitle">Start building habits that stick</p>

      <form id="s-form">
        <div class="input-group">
          <label for="FirstName">Name</label>
          <input type="text" name="FirstName" id="FirstName" placeholder="Enter your Name" required />
        </div>
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" name="email" id="email" placeholder="Enter your email" required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" name="password" id="password" placeholder="Enter your Password" required />
        </div>
        <div class="input-group">
          <label for="rpassword">Confirm Password</label>
          <input type="password" name="repeatPassword" id="rpassword" placeholder="Re-enter your Password" required />
        </div>
        <button type="submit">Sign Up</button>
      </form>

      <p class="form-footer">Already have an account? <a href="login.html">Login Here</a></p>
      <p class="motive-footer"><a href="our-motive.html">Our Motive</a></p>
    </div>
  </div>
</body>
</html>
