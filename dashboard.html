<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crystal</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>

  <header>
    <div class="top-nav">
      <a href="our-motive.html" id="motiveLink">Our Motive</a>
    </div>
    <div id="up">
      <h1>Build it: BRICK BY BRICK !!</h1>
      <p class="subtitle">Track your habits. Stay consistent.</p>
    </div>
  </header>

  <main>
    <div id="Q">
      <form id="h-form">
        <input type="text" id="newHabit" placeholder="What habit do you want to build?" required />

        <div class="radio-group">
          <legend>Select type of task:</legend>
          <label for="daily" class="radio-label">
            <input type="radio" id="daily" name="choice" value="daily" />
            Daily
          </label>
          <label for="deadline" class="radio-label">
            <input type="radio" id="deadline" name="choice" value="deadline" />
            Deadline
          </label>
        </div>

        <button type="submit" id="start">+ Add</button>
      </form>
    </div>

    <div id="allList">
      <div id="List">
        <span>DAILY GOALS</span>
        <ul id="habitList"></ul>
      </div>
      <div id="List2">
        <span>DEADLINE BASED TASKS</span>
        <ul id="DhabitList"></ul>
      </div>
    </div>
  </main>

  <footer>
    <div style="text-align: center" id="l">
      <button id="logout">Log Out</button>
    </div>
  </footer>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
